<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Тест панорамы</title>
</head>
<body style="margin:0; padding:20px; font-family:Arial;">
    <h1>Быстрый тест панорамы</h1>
    <canvas id="testCanvas" width="800" height="400" style="border:1px solid #ccc;"></canvas>
    <br><br>
    <button id="downloadBtn">Скачать тестовое изображение</button>
    <p>Создает простое градиентное панорамное изображение 800x400 для тестирования.</p>
    
    <script>
    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');
    
    // Создаем градиентное изображение
    const gradient = ctx.createLinearGradient(0, 0, 800, 400);
    gradient.addColorStop(0, '#ff6b6b');
    gradient.addColorStop(0.25, '#4ecdc4');
    gradient.addColorStop(0.5, '#45b7d1');
    gradient.addColorStop(0.75, '#96ceb4');
    gradient.addColorStop(1, '#feca57');
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 800, 400);
    
    // Добавляем текст
    ctx.fillStyle = 'white';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ТЕСТ ПАНОРАМА', 400, 200);
    ctx.font = '24px Arial';
    ctx.fillText('800x400 пикселей', 400, 240);
    
    // Добавляем сетку для ориентации
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    for(let x = 0; x <= 800; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 400);
        ctx.stroke();
    }
    for(let y = 0; y <= 400; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(800, y);
        ctx.stroke();
    }
    
    document.getElementById('downloadBtn').onclick = () => {
        const link = document.createElement('a');
        link.download = 'test-panorama.png';
        link.href = canvas.toDataURL();
        link.click();
    };
    </script>
</body>
</html>
