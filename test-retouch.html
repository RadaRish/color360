<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест ретуши Color360</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
        }
        .test-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .test-btn:hover {
            background: #45a049;
        }
        .test-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .status.success { background: #4CAF50; }
        .status.error { background: #f44336; }
        .status.info { background: #2196F3; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎨 Тест API ретуши</h1>
        <p>Эта страница тестирует работу API ретуши без сложной логики редактора.</p>
        
        <div id="status" class="status info">
            Готов к тестированию
        </div>
        
        <button id="testServiceHealth" class="test-btn">🔍 Проверить AI сервис</button>
        <button id="testRetouchAPI" class="test-btn">🎯 Тест API ретуши</button>
        <button id="clearLog" class="test-btn">🧹 Очистить лог</button>
        
        <div id="log" class="log">Лог тестирования:\n</div>
    </div>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }
        
        function setStatus(message, type = 'info') {
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        // Тест здоровья AI сервиса
        document.getElementById('testServiceHealth').onclick = async () => {
            addLog('🔍 Проверка AI сервиса...');
            try {
                const response = await fetch('/api/ai-health');
                const data = await response.json();
                addLog(`📊 AI сервис: ${JSON.stringify(data)}`);
                if (response.ok) {
                    setStatus('AI сервис работает', 'success');
                } else {
                    setStatus('AI сервис временно отключён', 'warning');
                }
            } catch (error) {
                addLog(`❌ Ошибка AI: ${error.message}`);
                setStatus('AI сервис недоступен', 'error');
            }
        };
        
        // Тест API ретуши с простым изображением
        document.getElementById('testRetouchAPI').onclick = async () => {
            addLog('🎯 Создание тестового изображения...');
            
            // Создаем простое тестовое изображение 100x100
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            
            // Рисуем простой градиент
            const gradient = ctx.createLinearGradient(0, 0, 100, 100);
            gradient.addColorStop(0, '#ff0000');
            gradient.addColorStop(1, '#0000ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 100, 100);
            
            // Создаем простую маску (белый круг в центре)
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = 100;
            maskCanvas.height = 100;
            const maskCtx = maskCanvas.getContext('2d');
            maskCtx.fillStyle = '#000000'; // Черный фон
            maskCtx.fillRect(0, 0, 100, 100);
            maskCtx.fillStyle = '#ffffff'; // Белый круг
            maskCtx.beginPath();
            maskCtx.arc(50, 50, 20, 0, 2 * Math.PI);
            maskCtx.fill();
            
            addLog('📤 Отправка на API ретуши...');
            
            try {
                // Конвертируем в blobs
                const imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const maskBlob = await new Promise(resolve => maskCanvas.toBlob(resolve, 'image/png'));
                
                // Отправляем на API
                const formData = new FormData();
                formData.append('image', imageBlob, 'test-image.png');
                formData.append('mask', maskBlob, 'test-mask.png');
                
                const response = await fetch('/api/retouch', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                addLog(`📨 Ответ получен: ${contentType}`);
                
                if (contentType.includes('application/json')) {
                    const result = await response.json();
                    addLog(`✅ JSON ответ: ${JSON.stringify(result)}`);
                    setStatus('API ретуши работает (JSON)', 'success');
                } else if (contentType.startsWith('image/')) {
                    const blob = await response.blob();
                    addLog(`✅ Изображение получено: ${blob.size} байт`);
                    setStatus('API ретуши работает (Image)', 'success');
                } else {
                    const text = await response.text();
                    addLog(`📄 Текстовый ответ: ${text}`);
                }
                
            } catch (error) {
                addLog(`❌ Ошибка API ретуши: ${error.message}`);
                setStatus('API ретуши не работает', 'error');
            }
        };
        
        // Очистка лога
        document.getElementById('clearLog').onclick = () => {
            log.textContent = 'Лог тестирования:\n';
            setStatus('Лог очищен', 'info');
        };
        
        // Автоматическая проверка при загрузке
        addLog('🚀 Страница тестирования загружена');
        addLog('💡 Нажмите кнопки для тестирования API');
    </script>
</body>
</html>
