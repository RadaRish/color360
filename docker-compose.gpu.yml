# Docker Compose с поддержкой GPU для Stable Diffusion
version: '3.8'

services:
  # Main Color360 site (landing page + API)
  color360-main:
    build: .
    container_name: color360-main
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SD_HOST=color360-sd
      - SD_PORT=5002
    volumes:
      - ./data:/app/data
      - ./temp:/app/temp
      - ./avatars:/app/avatars
    depends_on:
      - color360-sd
    restart: unless-stopped
    networks:
      - color360-network

  # Panorama editor application
  color360-pano:
    build: ./pano
    container_name: color360-pano
    volumes:
      - ./pano/export:/usr/share/nginx/html/export
    restart: unless-stopped
    networks:
      - color360-network

  # Stable Diffusion AI Service with GPU support
  color360-sd:
    build:
      context: .
      dockerfile: sd/Dockerfile
      target: cuda  # GPU версия
    container_name: color360-sd
    environment:
      - PORT=5002
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - sd-models:/home/app/.cache
      - sd-temp:/home/app/temp
    expose:
      - "5002"
    restart: unless-stopped
    networks:
      - color360-network
    # GPU конфигурация
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Альтернативный способ для старых версий Docker Compose
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  # React frontend app
  frontend:
    build: ./frontend
    container_name: color360-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - color360-network

  # Reverse proxy
  nginx:
    image: nginx:alpine
    container_name: color360-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - color360-main
      - color360-pano
      - color360-sd
      - frontend
    restart: unless-stopped
    networks:
      - color360-network

networks:
  color360-network:
    driver: bridge

volumes:
  sd-models:
    driver: local
  sd-temp:
    driver: local