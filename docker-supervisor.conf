[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:color360-lama]
directory=/app/lama
command=/app/lama/lama_env/bin/python service.py
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/lama.err.log
stdout_logfile=/var/log/supervisor/lama.out.log
environment=PORT=5002,HOST=127.0.0.1,PYTHONUNBUFFERED=1
priority=100

[program:color360-app]
directory=/app
command=/usr/bin/node server.js
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/app.err.log
stdout_logfile=/var/log/supervisor/app.out.log
environment=NODE_ENV=production,PORT=3000,LAMA_ENABLED=true,LAMA_PORT=5002
priority=200
depends_on=color360-lama

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
priority=300
depends_on=color360-app