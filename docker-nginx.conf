server {
    listen 80;
    server_name _;
    
    client_max_body_size 50M;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Основное приложение
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # WebSocket поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # LaMa AI сервис
    location /lama/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Увеличенные таймауты для AI обработки
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Большие файлы изображений
        client_max_body_size 50M;
    }
    
    # Статические файлы с оптимизацией
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp4|woff|woff2|ttf|eot)$ {
        root /app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        # Сжатие
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }
    
    # Загруженные файлы
    location /temp/ {
        alias /app/temp/;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    location /avatars/ {
        alias /app/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Логирование
    access_log /var/log/nginx/color360_access.log;
    error_log /var/log/nginx/color360_error.log warn;
}